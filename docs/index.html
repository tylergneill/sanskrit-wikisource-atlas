<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wikisource Category Tree</title>
  <link rel="stylesheet" href="./styles.css" />

  <!-- Sanscript: pick one source you like; this one is commonly used -->
  <script src="https://cdn.jsdelivr.net/npm/@indic-transliteration/sanscript@1.3.3/sanscript.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      Sanskrit Wikisource Mirror
      <a href="https://sa.wikisource.org/wiki/वर्गः:वर्गसर्वस्वम्" target="_blank" class="topbar-link" title="Original Wikisource Root Category">Source Root Page</a>
      <a href="about.html" class="topbar-link">README</a>
      <span id="appVersion" class="topbar-link" style="color: var(--muted); margin-left: 25px;"></span>
    </div>

    <nav class="topnav">
      <label class="navlabel" for="schemeSelect">Transliteration:</label>
      <select id="schemeSelect">
        <option value="devanagari" selected>Devanagari (original)</option>
        <option value="iast">IAST</option>
        <option value="itrans">ITRANS</option>
        <option value="hk">Harvard-Kyoto</option>
        <option value="iso">ISO 15919</option>
        <option value="slp1">SLP1</option>
      </select>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidenav">
      <div class="panelTitle">Categories</div>
      <div class="hint">
        Click ▸ to expand.
        <br/>
        Option/Shift-click to expand all.
      </div>
      <div id="sidebarTree" class="tree"></div>
    </aside>

    <main class="mainpane">
      <section id="content" class="content"></section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>

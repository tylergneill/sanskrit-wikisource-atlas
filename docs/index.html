<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wikisource Category Tree</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <!-- Sanscript: pick one source you like; this one is commonly used -->
  <script src="https://cdn.jsdelivr.net/npm/@indic-transliteration/sanscript@1.3.3/sanscript.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      Sanskrit Wikisource Mirror
      <a href="./about.html" class="topbar-link">About</a>
      <span id="appVersion" class="topbar-link" style="color: var(--muted); margin-left: 25px;"></span>
      <span id="dataUpdated" class="topbar-link" style="color: var(--muted); margin-left: 10px;"></span>
    </div>

    <nav class="topnav">
      <input type="text" id="searchInput" placeholder="Search..." class="search-input" />
      <span class="sep">|</span>
      <label class="navlabel" for="schemeSelect">Transliteration:</label>
      <select id="schemeSelect">
        <option value="devanagari" selected>Devanagari (original)</option>
        <option value="iast">IAST</option>
        <option value="itrans">ITRANS</option>
        <option value="hk">Harvard-Kyoto</option>
        <option value="iso">ISO 15919</option>
        <option value="slp1">SLP1</option>
      </select>
      <span class="sep">|</span>
      <button id="themeToggle" class="theme-toggle" type="button" title="Toggle light/dark theme"></button>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidenav">
      <div id="allRow" class="row allRow">
        <span class="title topLevel">All</span>
        <span id="allStats" class="small topLevel" style="margin-left:auto; padding-left:10px; opacity:0.7;"></span>
      </div>
      <hr class="allDivider" />
      <div class="hint">
        Option/Shift-click to expand all.
      </div>
      <div id="sidebarTree" class="tree"></div>
    </aside>

    <main class="mainpane">
      <section id="content" class="content"></section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>

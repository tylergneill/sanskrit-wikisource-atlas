<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About — Sanskrit Wikisource Mirror</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Sanskrit Wikisource Mirror</span>
      <a href="./index.html" class="topbar-link">← Back to tree</a>
    </div>
  </header>

  <main class="mainpane" style="height: calc(100% - 48px); display:flex; justify-content:center;">
    <section class="content" style="width:100%; max-width:900px;">
      <div class="block">
        <h2 style="margin-top:0;">About</h2>
        <p>
          A more accessible browsing interface for the Sanskrit text collection at
          <a href="https://sa.wikisource.org/" target="_blank">sa.wikisource.org</a>.
          Data snapshot refreshed automatically on a monthly basis.
        </p>
        <p>
          Part of the <a href="https://kalpataru-grove.info" target="_blank" >Kalpataru Grove</a> ecosystem.
        </p>
        <p>
          <a href="https://sa.wikisource.org/wiki/वर्गः:वर्गसर्वस्वम्" target="_blank">Category Source: वर्गः:वर्गसर्वस्वम्</a>
        </p>
        <p>
          <a href="https://github.com/tylergneill/sanskrit-wikisource-mirror" target="_blank">Code on GitHub</a>
        </p>
        <p class="small">
          <span id="appVersion"></span>
          <span id="dataUpdated" style="margin-left:10px;"></span>
        </p>
      </div>
    </section>
  </main>

  <script type="module">
    async function loadVersion() {
      try {
        const r = await fetch("./VERSION");
        if (!r.ok) return;
        const text = await r.text();
        for (const line of text.split("\n")) {
          if (!line.includes("=")) continue;
          const [key, rawValue] = line.split("=");
          const value = rawValue.trim().replace(/['"]/g, "");
          if (key.trim() === "__version__") {
            const el = document.getElementById("appVersion");
            if (el) el.textContent = "v" + value;
          } else if (key.trim() === "__data_version__") {
            const el = document.getElementById("dataUpdated");
            if (el) el.textContent = `data updated ${value}`;
          }
        }
      } catch (e) {
        console.log("Could not load version:", e);
      }
    }
    loadVersion();
  </script>
</body>
</html>
